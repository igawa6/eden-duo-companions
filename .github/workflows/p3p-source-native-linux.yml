name: P3P standalone Linux source build (v1.8.10 readiness)

on:
  push:
    branches:
      - p3p-thor-ui-source-port
    paths:
      - 'native/modules/**'
      - '.github/workflows/p3p-source-native-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3p-linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out companion C++ source
        uses: actions/checkout@v4
        with:
          path: eden-duo-companions
      - name: Check out documented Eden Duo SDK revision
        uses: actions/checkout@v4
        with:
          repository: igawa6/eden-duo
          ref: 8c28fd5d745d1ba5756a85dee00f5587ce0b35ad
          path: eden-duo-sdk
          submodules: false
      - name: Install C++ headers and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libfmt-dev nlohmann-json3-dev
      - name: Configure standalone P3P native module
        run: |
          cmake -S eden-duo-companions/native/modules -B build-p3p -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEDEN_SOURCE_ROOT="$GITHUB_WORKSPACE/eden-duo-sdk" \
            -DEDEN_FMT_INCLUDE_DIR=/usr/include \
            -DEDEN_NLOHMANN_JSON_INCLUDE_DIR=/usr/include \
            -DEDEN_P3P_STANDALONE=ON -DBUILD_TESTING=ON
      - name: Compile P3P C++ module and tests
        run: cmake --build build-p3p --parallel 2 --target dsmod-p3p p3p-module-test
      - name: Run P3P native unit tests
        run: ctest --test-dir build-p3p -R '^dsmod-p3p$' --output-on-failure
      - name: Inspect public ELF module exports
        run: |
          test -s build-p3p/0100DCD01525A000.so
          nm -D --defined-only build-p3p/0100DCD01525A000.so | grep -E 'eden_dsmod_get_module|eden_dsmod_get_extensions|eden_dsmod_get_font_extensions'
      - name: Publish source-built module for local QA
        uses: actions/upload-artifact@v4
        with:
          name: p3p-linux-x86_64-source-module
          path: build-p3p/0100DCD01525A000.so
          if-no-files-found: error
          retention-days: 14
