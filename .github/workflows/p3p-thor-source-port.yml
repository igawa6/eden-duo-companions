name: P3P Thor source port checks

on:
  push:
    branches:
      - p3p-thor-ui-source-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q tools/p3p/gen_manifest.py tools/p3p/thor_ui.py tools/p3p/test_thor_ui.py
      - name: Generate the P3P manifest
        run: python tools/p3p/gen_manifest.py
      - name: Verify the exact v1.8.10 FINAL manifest reference
        run: python tools/p3p/v1810/test_reference.py
      - name: Export the exact v1.8.10 reference manifest
        run: python tools/p3p/v1810/v1810_reference.py --output /tmp/p3p-v1.8.10-reference.json
      - name: Run experimental source-port structural tests
        run: python tools/p3p/test_thor_ui.py
      - name: Generate the source-ported UI manifest (opt-in)
        run: python tools/p3p/gen_manifest.py --thor-ui
      - name: Ensure repeated UI generation is stable
        run: |
          cp packages/Persona3Portable/dualscreen/manifest.json /tmp/p3p-thor-once.json
          python tools/p3p/thor_ui.py
          cmp /tmp/p3p-thor-once.json packages/Persona3Portable/dualscreen/manifest.json
      - name: Check that emitted JSON parses and has expected integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('packages/Persona3Portable/dualscreen/manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['pages']) == 12
          assert len(data['module_outputs']) == 2798
          assert len(data['actions']) == 61
          pages = {page['id']: page for page in data['pages']}
          assert all('file:img/' not in w.get('src', '')
                     for page in pages.values() for w in page['widgets'])
          assert len(pages['start']['widgets']) == 12
          assert len(pages['personas']['widgets']) > 147
          assert len(pages['talk']['widgets']) > 58
          assert any(w.get('bind_text') == 'cal.41.text'
                     and w.get('rect', [0, 0])[1] == 738
                     for w in pages['calendar']['widgets'])
          assert sum(bool(w.get('on_tap')) for w in
                     pages['talk']['widgets']) == 25
          print('P3P Thor source manifest: generation and checks passed')
          PY
      - name: Save exact final reference manifest for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: p3p-v1.8.10-exact-reference
          path: /tmp/p3p-v1.8.10-reference.json
          if-no-files-found: error
          retention-days: 14
      - name: Save experimental source-port manifest (not release)
        uses: actions/upload-artifact@v4
        with:
          name: p3p-thor-ui-experimental-manifest
          path: packages/Persona3Portable/dualscreen/manifest.json
          if-no-files-found: error
          retention-days: 14
